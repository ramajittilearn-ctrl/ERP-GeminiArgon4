version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: taky_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taky_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taky_local_secret_2026}
      POSTGRES_DB: taky_apartment_erp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taky_admin -d taky_apartment_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
