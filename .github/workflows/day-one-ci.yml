name: Day-one baseline checks
on:
  pull_request:
  push:
    branches:
      - fix/clean-day-one-golive
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify static GitHub Pages state + syntax
        run: node tests/day-one-pages-check.mjs
      - name: Install dependencies and generate Prisma client
        run: |
          npm install --no-audit --no-fund
          npx prisma generate
      - name: Run new focused day-one unit tests
        run: npx vitest run tests/unit/day-one-baseline.test.ts
      - name: Build Next.js application
        run: npm run build
